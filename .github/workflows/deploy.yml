# Despliegue FTP MANUAL (no se ejecuta con cada push). Requiere autorización antes de lanzarlo.
# AJUSTAR los nombres de los secretos si los del repositorio se llaman distinto.
name: Deploy (manual)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: p3plzcpnl489523.prod.phx3.secureserver.net   # host FTP (no es secreto)
          username: deploy@digicyus.com   # usuario FTP (no es secreto); la contraseña sigue en FTP_PASSWORD
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /fincalalolita.digicyus.com/
          exclude: |
            **/.git*
            **/.git*/**
            tests/**
            docs/**
            README.md
