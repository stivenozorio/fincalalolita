# Compara los secretos FTP SIN mostrarlos y SIN conectarse al servidor (cero riesgo de bloqueo).
# Imprime: largo, si hay espacios/saltos de línea, y los primeros 8 caracteres del SHA-256.
# Para comparar: en tu computador, printf '%s' 'valor' | shasum -a 256 | cut -c1-8
name: Check FTP secrets (no conecta)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Huellas de los secretos
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          show() {
            local name="$1" val="$2" ws="no"
            [[ "$val" =~ [[:space:]] ]] && ws="SI"
            printf '%-14s largo=%-3s espacios_o_saltos=%-2s huella=%s\n' "$name" "${#val}" "$ws" "$(printf '%s' "$val" | sha256sum | cut -c1-8)"
          }
          show FTP_SERVER   "$S"
          show FTP_USERNAME "$U"
          show FTP_PASSWORD "$P"
